<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astral Beach</title>

  <script>
    if (window.location.hostname.startsWith("www.")) {
      const url = window.location.href.replace("www.", "");
      window.location.replace(url);
    }
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url('background3.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    /* ESCURECER FUNDO */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: -1;
    }

    .logo {
      max-width: 320px;
      width: 100%;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .button-container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 1;
    }

    .button-container a {
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      transition: all 0.25s ease;
      display: inline-block;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    /* BOTÃO PRINCIPAL */
    .button-container a.delivery {
      background: linear-gradient(135deg, #FB923C, #F97316);
      transform: scale(1.05);
    }

    .button-container a.whatsapp { background-color: #22C55E; }
    .button-container a.localizacao { background-color: #3B82F6; }

    .button-container a.cardapio {
      background-color: #FACC15;
      color: #000;
    }

    .button-container a.instagram { background-color: #EF4444; }
    .button-container a.tripadvisor { background-color: #0F766E; }

    .button-container a.google {
      background: linear-gradient(135deg, #FFD54F, #F59E0B);
      color: #000;
    }

    .button-container a:hover {
      transform: scale(1.05);
      opacity: 0.95;
    }

    @media (max-width: 500px) {
      .button-container a {
        font-size: 15px;
        padding: 12px 20px;
      }
    }
  </style>
</head>

<body>
  <img src="logo.png" alt="Logo Astral Beach" class="logo">

  <div class="button-container">
    
    <a href="https://astralbeach.saipos.com/home" target="_blank" class="delivery">
      Delivery | Retirada
    </a>

    <a href="https://wa.me/5522999826331" target="_blank" class="whatsapp">
      Falar no WhatsApp
    </a>

    <a href="https://www.google.com/maps/place/Astral+Beach+Food/data=!4m2!3m1!1s0x0:0x71e15ba1233946c7?sa=X&ved=1t:2428&ictx=111" target="_blank" class="localizacao">
      Como Chegar
    </a>

    <a href="https://drive.google.com/file/d/1hjSURhHWdE-7OKBbWpvP01T4cRKHj7oU/view" target="_blank" class="cardapio">
      Ver Cardápio
    </a>

    <a href="https://www.instagram.com/astralbeach.food/" target="_blank" class="instagram">
      Instagram
    </a>

    <a href="https://www.tripadvisor.com.br/Restaurant_Review-g1056623-d15137632-Reviews-Astral_Beach_Food-Arraial_do_Cabo_State_of_Rio_de_Janeiro.html" target="_blank" class="tripadvisor">
      TripAdvisor
    </a>

    <a href="https://search.google.com/local/writereview?placeid=ChIJY1u6wSNxmAARx0Y5I6FbkXE" target="_blank" class="google">
      ⭐ Google avaliações
    </a>

  </div>
</body>
</html>
